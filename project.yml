name: Switchboard
options:
  bundleIdPrefix: com.mattmilliken
  deploymentTarget:
    macOS: '14.0'

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Pinned exactly, not a floating range: `make dmg` Developer ID-signs and
    # notarizes whatever resolves here, so an unreviewed upstream release would
    # ship to users as software Gatekeeper vouches for. Bump deliberately.
    exactVersion: 2.4.0

targets:
  Switchboard:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Switchboard
        CFBundleName: Switchboard
        CFBundleIdentifier: com.mattmilliken.switchboard
        CFBundleIconFile: AppIcon
        CFBundleVersion: '3'
        CFBundleShortVersionString: '0.2.0'
        NSAccessibilityUsageDescription: Switchboard needs Accessibility access to list and switch between your open windows.
        NSAppleEventsUsageDescription: Switchboard uses Apple Events to switch tabs in Chrome, Safari, and Terminal.
        NSHumanReadableCopyright: Copyright © 2026 Matt Milliken. All rights reserved.
    entitlements:
      path: Switchboard.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        SWIFT_VERSION: '5.0'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGNING_REQUIRED: 'NO'
        CODE_SIGN_IDENTITY: ''
        PRODUCT_BUNDLE_IDENTIFIER: com.mattmilliken.switchboard

  # Hostless unit tests: compiles the pure search/ranking code straight into
  # the bundle, so `make test` never launches the app or touches TCC grants.
  SwitchboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Search
    settings:
      base:
        SWIFT_VERSION: '5.0'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGNING_REQUIRED: 'NO'
        CODE_SIGN_IDENTITY: '-'
        GENERATE_INFOPLIST_FILE: 'YES'

schemes:
  Switchboard:
    build:
      targets:
        Switchboard: all
    test:
      targets:
        - SwitchboardTests
